<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>더모아 계산기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2316302B'/><circle cx='16' cy='16' r='7.5' fill='none' stroke='%232E7D5B' stroke-width='2.5'/><path d='M16 8.5v15' stroke='%23C4D0CB' stroke-width='2.5' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/css/app.css?v=138">
</head>
<body>

  <!-- 로그인이 없다. /api/more 가 공개 고시환율만 내주고 개인 정보를 다루지 않아서다 —
       그래서 supabase 번들도 db.js 도 안 싣는다(페이지가 훨씬 가볍다). -->
  <section class="wrap">
    <header class="top">
      <div class="who">
        <h1>더모아 계산기</h1>
        <div class="span ko">해외에서 얼마를 긁어야 999원에 맞나</div>
      </div>
      <a class="act" href="/">여행</a>
    </header>

    <div class="mcbody">
      <form class="form inline" id="mc-form" onsubmit="return false">
        <div class="row">
          <div class="field kind"><label for="mc-cur">통화</label>
            <select id="mc-cur"></select></div>
          <div class="field"><label for="mc-amt">이만큼 긁으면</label>
            <input id="mc-amt" type="number" inputmode="decimal" step="any" min="0"></div>
        </div>
        <p class="mcone" id="mc-one"></p>

        <!-- 기본값은 한국시간 지금. 신한 1회차가 한국 아침에 나오므로 기준이 서울이다.
             ★비자가 약 1년치만 주므로 그 앞은 아예 못 고르게 min 을 건다. -->
        <div class="field">
          <label for="mc-when">거래 일시 <span class="opt">한국시간</span></label>
          <input id="mc-when" type="datetime-local">
        </div>
      </form>

      <div id="mc-tab"></div>
      <p class="hint" id="mc-src"></p>
    </div>
  </section>

<script src="/js/util.js?v=138"></script>
<script src="/js/more.js?v=138"></script>
<script src="/js/themore.js?v=138"></script>
</body>
</html>
