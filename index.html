<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- maximum-scale 을 박지 않는다 — 두 손가락 확대를 빼앗는 대신 입력칸 글자를 16px 로 키운다(app.css) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>여행 일정표</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2316302B'/><path d='M11 6v20' stroke='%23C4D0CB' stroke-width='2.5' stroke-linecap='round'/><circle cx='11' cy='11' r='3.6' fill='%232E7D5B'/><circle cx='11' cy='22' r='3.6' fill='%233B6EA5'/></svg>">
<link rel="stylesheet" href="/css/leaflet-1.9.4.css">
<link rel="stylesheet" href="/css/app.css?v=9">
</head>
<body>

<!-- ── 로그인 게이트 ───────────────────────────────────────────────────────
     로그인 없이 할 수 있는 일이 없다 — 일정도 링크 프록시도 세션을 요구한다. -->
<div class="gate" id="gate" hidden>
  <h1>여행 일정표</h1>
  <p>구글 계정으로 들어오면 내가 만든 여행과 초대받은 여행이 보입니다.</p>
  <button class="btn" id="signin" type="button">구글로 계속하기</button>
  <p class="err" id="gate-err"></p>
</div>

<div id="app" hidden>

  <!-- ── 여행 목록 ─────────────────────────────────────────────────────── -->
  <section id="view-trips" class="wrap" hidden>
    <header class="top">
      <div class="who">
        <h1>여행</h1>
        <div class="span" id="who"></div>
      </div>
      <button class="btn ghost sm" id="signout" type="button">로그아웃</button>
    </header>

    <div class="trips" id="trips"></div>

    <div class="forms">
      <details id="new-wrap">
        <summary>새 여행 만들기</summary>
        <form id="new" class="form">
          <div class="field">
            <label for="new-name">여행 이름</label>
            <input id="new-name" name="name" type="text" required maxlength="60" placeholder="오사카">
          </div>
          <div class="row">
            <div class="field">
              <label for="new-from">시작</label>
              <input id="new-from" name="from" type="date" class="mono">
            </div>
            <div class="field">
              <label for="new-to">끝</label>
              <input id="new-to" name="to" type="date" class="mono">
            </div>
            <div class="field cur">
              <label for="new-cur">기준통화</label>
              <select id="new-cur" name="cur">
                <option value="KRW">KRW</option>
                <option value="JPY">JPY</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="TWD">TWD</option>
                <option value="THB">THB</option>
                <option value="VND">VND</option>
              </select>
            </div>
          </div>
          <p class="hint">날짜는 나중에 정해도 됩니다. 기준통화는 비용 합계를 환산할 통화입니다.</p>
          <button class="btn" id="new-save" type="submit">만들기</button>
          <p class="err" id="new-err"></p>
        </form>
      </details>

      <details>
        <summary>초대 코드로 참여하기</summary>
        <form id="join" class="form">
          <div class="field">
            <label for="join-code">초대 코드</label>
            <input id="join-code" name="code" type="text" class="mono" required
                   autocomplete="off" spellcheck="false" placeholder="a1b2c3d4e5f6">
          </div>
          <button class="btn" id="join-btn" type="submit">참여하기</button>
          <p class="err" id="join-err"></p>
        </form>
      </details>
    </div>
  </section>

  <!-- ── 여행 하나 ─────────────────────────────────────────────────────── -->
  <section id="view-trip" class="wrap" hidden>
    <header class="top">
      <button class="back" id="back" type="button" aria-label="여행 목록으로">←</button>
      <div class="who">
        <h1 id="trip-name"></h1>
        <div class="span" id="trip-span"></div>
      </div>
    </header>

    <!-- 일정 — js/plan.js 가 채운다 -->
    <div class="pane" data-tab="plan">
      <nav class="daytabs" id="daytabs" role="tablist" aria-label="날짜" hidden></nav>
      <div id="days"></div>

      <div class="forms">
        <details id="if-wrap">
          <summary id="if-sum">일정 추가</summary>
          <form id="if-form" class="form">
            <input type="hidden" id="if-id">
            <input type="hidden" id="if-lat">
            <input type="hidden" id="if-lng">

            <div class="field">
              <label for="if-link">구글맵 링크</label>
              <input id="if-link" type="text" inputmode="url" autocomplete="off" spellcheck="false"
                     placeholder="https://maps.app.goo.gl/… 붙여넣기">
              <p class="hint" id="if-geo">좌표 없음 — 지도와 거리 표시에서 빠집니다</p>
            </div>

            <div class="field">
              <label for="if-name">장소명</label>
              <input id="if-name" type="text" required maxlength="80" placeholder="오사카성">
            </div>

            <div class="row">
              <div class="field"><label for="if-date">날짜</label>
                <input id="if-date" type="date" class="mono" required></div>
              <div class="field"><label for="if-time">시각</label>
                <input id="if-time" type="time" class="mono"></div>
              <div class="field cur"><label for="if-kind">구분</label>
                <select id="if-kind"></select></div>
            </div>

            <div class="row">
              <div class="field"><label for="if-cost">비용</label>
                <input id="if-cost" type="number" inputmode="decimal" step="any" min="0" class="mono"></div>
              <div class="field cur"><label for="if-cur">통화</label>
                <select id="if-cur">
                  <option>KRW</option><option>JPY</option><option>USD</option>
                  <option>EUR</option><option>TWD</option><option>THB</option><option>VND</option>
                </select></div>
              <div class="field cur"><label for="if-fx">환율</label>
                <input id="if-fx" type="number" inputmode="decimal" step="any" min="0" class="mono"></div>
            </div>
            <p class="hint">환율은 기준통화로 바꿀 비율입니다. 비워 두면 합계에서 빠지고 그 사실을 적습니다.</p>

            <div class="row">
              <div class="field"><label for="if-ref">예약번호</label>
                <input id="if-ref" type="text" class="mono" maxlength="40" autocomplete="off"></div>
              <div class="field"><label for="if-book">예약 링크</label>
                <input id="if-book" type="text" inputmode="url" autocomplete="off" spellcheck="false"></div>
            </div>

            <div class="field">
              <label for="if-memo">메모</label>
              <textarea id="if-memo" rows="2" maxlength="500"></textarea>
            </div>

            <div class="row btns">
              <button class="btn" id="if-save" type="submit">저장</button>
              <button class="btn ghost danger" id="if-del" type="button" hidden>지우기</button>
            </div>
            <p class="err" id="if-err"></p>
          </form>
        </details>
      </div>
    </div>

    <div class="pane" data-tab="map" hidden>
      <nav class="daytabs" id="mapdays" role="tablist" aria-label="날짜" hidden></nav>
      <div id="map"></div>
      <p class="note" id="map-note"></p>
    </div>
    <!-- 비용 — js/cost.js -->
    <div class="pane" data-tab="cost" hidden>
      <div class="ctotal" id="cost-total"></div>
      <div id="cost-blocks"></div>
      <div id="cost-miss"></div>
      <p class="note" id="cost-msg"></p>
    </div>

    <!-- 준비물 — js/prep.js -->
    <div class="pane" data-tab="prep" hidden>
      <div class="cblock">
        <h3 class="chd">준비물 <span class="cn" id="prep-count"></span></h3>
        <ul class="prep" id="prep-list"></ul>
        <form id="prep-form" class="form">
          <div class="row">
            <input id="prep-text" type="text" maxlength="120" placeholder="유심 · 비자 · 상비약 · 콘센트 어댑터"
                   autocomplete="off">
            <button class="btn" id="prep-add" type="submit">추가</button>
          </div>
          <p class="err" id="prep-err"></p>
        </form>
      </div>
    </div>

    <!-- 동행자 · 여행 설정 — js/crew.js -->
    <div class="pane" data-tab="crew" hidden>
      <section class="cblock">
        <h3 class="chd">동행자 <span class="cn" id="crew-count"></span></h3>
        <ul class="crew" id="crew-list"></ul>
      </section>

      <section class="cblock">
        <h3 class="chd">초대 링크</h3>
        <div class="form">
          <div class="row">
            <input id="crew-link" type="text" class="mono" readonly aria-label="초대 링크">
            <button class="btn" id="crew-copy" type="button">복사</button>
          </div>
          <p class="hint">이 링크를 연 사람은 이 여행에 참여합니다.
            참여하면 <strong>서로의 이메일이 보입니다.</strong></p>
        </div>
      </section>

      <section class="cblock">
        <h3 class="chd">여행 설정</h3>
        <form id="crew-form" class="form">
          <div class="field">
            <label for="set-name">여행 이름</label>
            <input id="set-name" type="text" maxlength="60" required>
          </div>
          <div class="row">
            <div class="field"><label for="set-from">시작</label>
              <input id="set-from" type="date" class="mono"></div>
            <div class="field"><label for="set-to">끝</label>
              <input id="set-to" type="date" class="mono"></div>
            <div class="field cur"><label for="set-cur">기준통화</label>
              <select id="set-cur">
                <option>KRW</option><option>JPY</option><option>USD</option>
                <option>EUR</option><option>TWD</option><option>THB</option><option>VND</option>
              </select></div>
          </div>
          <p class="hint" id="set-note"></p>
          <div class="row btns">
            <button class="btn" id="set-save" type="submit">저장</button>
            <button class="btn ghost danger" id="set-del" type="button" hidden>여행 지우기</button>
          </div>
          <p class="err" id="set-err"></p>
        </form>
      </section>

      <p class="note" id="crew-msg"></p>
    </div>
  </section>

</div>

<div class="obox" id="obox" hidden></div>

<nav class="tabs" id="tabs" role="tablist" aria-label="화면" hidden>
  <button type="button" role="tab" data-tab="plan" aria-selected="true">일정</button>
  <button type="button" role="tab" data-tab="map"  aria-selected="false">지도</button>
  <button type="button" role="tab" data-tab="cost" aria-selected="false">비용</button>
  <button type="button" role="tab" data-tab="prep" aria-selected="false">준비물</button>
  <button type="button" role="tab" data-tab="crew" aria-selected="false">동행자</button>
</nav>

<!-- 로드 순서가 곧 의존성이다. 클래식 스크립트라 전역 스코프를 공유한다 — 순서를 바꾸면 안 된다.
     gmaps.js 는 geo.js 의 GEO 를 쓰고, app.js 는 DB 를 쓴다. -->
<script src="/js/vendor/supabase-js-2.111.0.js"></script>
<script src="/js/supabase-config.js?v=9"></script>
<script src="/js/util.js?v=9"></script>
<script src="/js/geo.js?v=9"></script>
<script src="/js/gmaps.js?v=9"></script>
<script src="/js/db.js?v=9"></script>
<script src="/js/outbox.js?v=9"></script>
<script src="/js/vendor/leaflet-1.9.4.js"></script>
<script src="/js/plan.js?v=9"></script>
<script src="/js/map.js?v=9"></script>
<script src="/js/crew.js?v=9"></script>
<script src="/js/cost.js?v=9"></script>
<script src="/js/prep.js?v=9"></script>
<script src="/js/app.js?v=9"></script>

</body>
</html>
